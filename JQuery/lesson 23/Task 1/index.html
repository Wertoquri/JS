<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
    <script src="../../jquery-3.6.3.js"></script>
    <style>
        .catch {
            border-radius: 50%;
            height: 100px;
            width: 100px;
            background-color: aqua;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 100px;
            left: 120px;
            transition: all 1s;
        }
    </style>
    <script>
        $(document).ready(function(){
            $(".catch").mouseenter(function(){
                $(this).css({
                    "left": `${Math.floor(Math.random()*95)}vw`,
                    "top": `${Math.floor(Math.random()*95)}vh`,
                    "background-color": `rgb(${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)}`
                })
            })
        })
    </script>
</head>
<body>
    <div class="catch">Catch me!</div>
</body>
</html>
